name: Deploy to Staging

on:
  push:
    branches: [ staging ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Set environment variables for PostgreSQL (from GitHub Secrets)
      # These will be used for migrations and E2E tests
      - name: Set PostgreSQL environment variables
        run: |
          echo "DATABASE_TYPE=${{ secrets.DATABASE_TYPE }}" >> .env
          echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "NODE_ENV=development" >> .env
        shell: bash

      - name: Debug environment file
        run: cat .env

      # Step 5: Run database migrations
      - name: Run database migrations
        if: github.ref == 'refs/heads/staging'  # Only run on the staging branch
        run: npm run migration:run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Step 7: Build Docker image
      - name: Build Docker image
        run: docker build -t playervista-api:latest .
